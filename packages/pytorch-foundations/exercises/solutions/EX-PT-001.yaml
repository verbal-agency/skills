answer: "nn.Linear(8, 4) expects the last dimension to be 8, but [8, 3] has feature width 3 if the first dimension is batch. Use nn.Linear(3, 4) or change the data layout only if the semantic axes really are reversed."
evidence: ["Names the last-dimension contract", "Does not recommend a blind reshape"]
