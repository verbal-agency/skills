answer: "Use optimizer.zero_grad(); predictions = model(x); loss = loss_fn(predictions, y); loss.backward(); optimizer.step(). step consumes the gradients currently stored on parameters, so calling it before backward uses stale or missing values. Inspecting parameter.grad before each step and checking deterministic loss movement expose the error."
evidence: ["Correct order", "Causal explanation", "Verification proposal"]
