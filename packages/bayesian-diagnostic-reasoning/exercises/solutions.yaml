schema: learning-solutions/v1
items:
  EX-BAY-001: "Sensitivity is P(positive | disease); P(disease | positive) also needs prevalence and false-positive behavior."
  EX-BAY-002: "For 10,000 people: TP 90, FN 10, TN 9,405, and FP 495. PPV is 90/(90+495) ≈ 15.4%."
  EX-BAY-003: "The frequency table and formula agree; the denominator includes both true and false positives."
  EX-BAY-004: "At posterior p, act when p*C_FN exceeds (1-p)*C_FP plus any action cost. With C_FN=20, C_FP=1, and no additional action cost, the threshold is 1/21 ≈ 4.8%, so a 15.4% posterior clears it; the decision must be revisited if costs or alternatives change."
